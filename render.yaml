# Render Blueprint - https://render.com/docs/blueprint-spec
#
# RECORD OF THE LIVE SERVICE. Production runs on a Render Web Service
# created by hand in the dashboard (tugrikrate-backend-service,
# srv-daudq6ugekts73e2ke90), not from this file. Render does not read
# this file for that service: change settings in the dashboard, then
# mirror them here so this stays an accurate record. It can recreate
# the service from scratch via New > Blueprint if ever needed - in that
# case delete the old service first, because two copies of the
# in-process scheduler would double every crawl. See ARCHITECTURE.md §8.
#
# The scheduler runs inside the web process (app/services/scheduler.py),
# so no separate worker is needed, which is what makes the 30-minute
# cadence possible on a free plan with no worker type.
#
# Free plan facts that shape the values below:
#   - 512MB RAM / 0.1 CPU. Upstream recorded repeated OOM kills from a
#     headless Chromium beside the HTTP crawler pool, so the settings
#     are conservative.
#   - The instance sleeps after 15 minutes without inbound traffic,
#     stopping the scheduler; SELF_PING_URL keeps it awake.
#   - No persistent disk: the database is external (Neon free Postgres,
#     AWS Singapore), passed in as DATABASE_URL.
#
# Only values that differ from app/config.py's defaults are listed.
# The full reference lives in .env.example and README.md.
services:
  - type: web
    name: tugrikrate-backend-service
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Deploy only after GitHub Actions CI passes on main.
    autoDeployTrigger: checksPass
    envVars:
      # Secrets - Render asks for these when a Blueprint is created;
      # set them in the dashboard for an existing service.
      # Neon's DIRECT connection string (host without -pooler).
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      # Optional performance hint for ArigBank; the crawler signs in
      # fresh when unset, so leaving it blank forever is fine.
      - key: ARIGBANK_BEARER_TOKEN
        sync: false
      # Free tier is 512MB / 0.1 CPU. app/config.py's defaults assume
      # more headroom than that.
      - key: MAX_WORKERS
        value: "4"
      - key: PLAYWRIGHT_MAX_WORKERS
        value: "1"
      # Run the five Playwright sources every 2 hours while active
      # (4 x the 30-minute base interval; it was 8 x 15 minutes before
      # 2026-10-08), so a headless Chromium is in memory rarely. Raise
      # if the instance gets OOM-killed. The dashboard value must match:
      # left at 8 it would mean every 4 hours.
      - key: CRAWL_PLAYWRIGHT_MULTIPLIER
        value: "4"
      # Render's edge proxy is a trustworthy source for X-Forwarded-For,
      # unlike the conservative app-level default of false.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Both MUST include https:// - without it logo URLs start with
      # "-" and the self-ping fails (seen on the first deploy).
      #   PUBLIC_BASE_URL = https://tugrikrate-backend-service.onrender.com
      #   SELF_PING_URL   = <that>/api/health
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SELF_PING_URL
        sync: false
      # fxRatesAPI's licence allows its data only inside our own app.
      # REQUIRE_APP_KEY makes the server refuse to start while
      # APP_API_KEYS is empty, so production can never serve it openly
      # (the development default does). Set APP_API_KEYS in the
      # dashboard to the value built into the iOS app, and
      # FXRATESAPI_KEY to the provider key.
      - key: REQUIRE_APP_KEY
        value: "true"
      - key: APP_API_KEYS
        sync: false
      - key: FXRATESAPI_KEY
        sync: false

# Splitting the five Playwright sources into their own process keeps
# headless Chromium out of the process that serves requests, so an OOM
# kill can no longer take the API down with it. A worker is a paid
# process type on Render, so it is left commented out here - the block
# above runs everything in one process (CRAWL_GROUP defaults to "all").
#
# To split: set CRAWL_GROUP=fast on the web service above, uncomment
# this, and point both at the same Postgres DATABASE_URL.
#
#   - type: worker
#     name: tugrikrate-collector
#     runtime: docker
#     plan: starter
#     region: singapore
#     branch: main
#     dockerfilePath: ./Dockerfile
#     dockerContext: .
#     dockerCommand: python -m scripts.worker
#     envVars:
#       - key: CRAWL_GROUP
#         value: "slow"
#       - key: DATABASE_URL
#         sync: false
#       - key: PLAYWRIGHT_MAX_WORKERS
#         value: "2"
